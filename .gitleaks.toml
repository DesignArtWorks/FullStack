[[rules]]
id = "escala-secret-assignment"
description = "Quoted application secret literal"
regex = '''(?i)(?:NEXTAUTH_SECRET|AUTH_SECRET|JWT_SECRET|ADMIN_JWT_SECRET|INTERNAL_BFF_SHARED_SECRET|API_TOKEN_SALT|TRANSFER_TOKEN_SALT|ENCRYPTION_KEY)["']?\s*[:=]\s*["']([a-z0-9_.,/+=-]{12,})["']'''
secretGroup = 1

[[rules]]
id = "escala-private-key-header"
description = "Private-key material, including truncated PEM files"
regex = '''-----BEGIN(?: [A-Z0-9]+)* PRIVATE KEY-----'''
