name: Monorepo CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versioned-secret-scan:
    name: Security / Versioned Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git fetch origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Prove secret detection and scan complete history
        run: |
          image=zricethezav/gitleaks:v8.24.2@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4
          docker run --rm -v "$PWD:/repo:ro" --entrypoint sh "$image" /repo/scripts/security/test-secret-scanner.sh
          docker run --rm -v "$PWD:/repo:ro" "$image" git --config /repo/.gitleaks.toml --log-opts=--all --redact=100 --no-banner /repo

      - name: Reject hardcoded credentials in tracked files
        shell: pwsh
        run: ./scripts/security/check-versioned-secrets.ps1

  backend-unit:
    name: Backend / Unit and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Require Docker
        run: docker info

      - name: Test and build backend artifact
        working-directory: Backend/java-app1/demo
        run: docker run --rm -v "$PWD:/workspace" -w /workspace maven:3.9-eclipse-temurin-25 mvn -B package

  backend-integration:
    name: Backend / Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Require Docker for Testcontainers
        run: docker info

      - name: Run integration tests in a disposable nested daemon
        working-directory: Backend/java-app1/demo
        shell: bash
        run: |
          set -euo pipefail
          network="integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          daemon="dind-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -fv "$daemon" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p target
          chmod -R a+rwx target
          docker network create "$network"
          # Privilege is used only by the disposable nested daemon, with no host
          # filesystem/socket mounts and no published port. PR code runs in the
          # unprivileged Maven container and can control only this nested daemon.
          docker run -d --name "$daemon" --network "$network" --network-alias dind \
            --privileged -e DOCKER_TLS_CERTDIR= docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
          ready=false
          for attempt in {1..30}; do
            if docker exec -e DOCKER_HOST=unix:///var/run/docker.sock "$daemon" docker info >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs "$daemon" || true
            exit 1
          fi
          docker run --rm --network "$network" --cap-drop ALL --security-opt no-new-privileges \
            -e DOCKER_HOST=tcp://dind:2375 -e TESTCONTAINERS_HOST_OVERRIDE=dind \
            -e TESTCONTAINERS_RYUK_DISABLED=true \
            -v "$PWD:/workspace" -w /workspace maven:3.9-eclipse-temurin-25 \
            mvn -B --no-transfer-progress -Pintegration test

      - name: Reject skipped, empty or missing integration tests
        shell: bash
        working-directory: Backend/java-app1/demo
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/com.escala.authservice.integration.*IntegrationTest.txt)
          if (( ${#reports[@]} == 0 )); then
            echo "No integration test report was produced."
            exit 1
          fi
          for report in "${reports[@]}"; do
            if ! grep -Eq 'Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0' "$report"; then
              echo "Integration report is skipped, empty or unsuccessful: $report"
              exit 1
            fi
          done

  frontend:
    name: Frontend / Quality and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXTAUTH_SECRET: ci-only-nextauth-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8080
      NEXT_INTERNAL_API_BASE_URL: http://localhost:8080
      NEXT_INTERNAL_STRAPI_URL: http://localhost:1337
      NEXT_PUBLIC_STRAPI_PUBLIC_URL: http://localhost:1337
      NEXT_PUBLIC_RECAPTCHA_ENABLED: "false"
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install, lint, typecheck and build frontend
        working-directory: Frontend/web-app3/escala
        run: >-
          docker run --rm
          -e CI -e NEXTAUTH_SECRET -e NEXTAUTH_URL -e API_BASE_URL
          -e NEXT_INTERNAL_API_BASE_URL -e NEXT_INTERNAL_STRAPI_URL
          -e NEXT_PUBLIC_STRAPI_PUBLIC_URL -e NEXT_PUBLIC_RECAPTCHA_ENABLED
          -v "$PWD:/workspace" -w /workspace node:22-bookworm-slim
          sh -c "corepack enable && corepack prepare pnpm@10.33.3 --activate &&
          pnpm install --frozen-lockfile && pnpm run lint &&
          pnpm run typecheck && pnpm run build"

  cms:
    name: CMS / Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi_ci
      DATABASE_USERNAME: strapi_ci
      DATABASE_PASSWORD: ci-only-not-for-production
      DATABASE_SSL: "false"
      APP_KEYS: ci-app-key-1,ci-app-key-2,ci-app-key-3,ci-app-key-4
      API_TOKEN_SALT: ci-api-token-salt
      ADMIN_JWT_SECRET: ci-admin-jwt-secret
      TRANSFER_TOKEN_SALT: ci-transfer-token-salt
      ENCRYPTION_KEY: ci-encryption-key
      STRAPI_CRON_ENABLED: "false"
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install and build Strapi CMS
        working-directory: Backend/cms-strapi
        run: >-
          docker run --rm
          -e NODE_ENV -e DATABASE_CLIENT -e DATABASE_HOST -e DATABASE_PORT
          -e DATABASE_NAME -e DATABASE_USERNAME -e DATABASE_PASSWORD -e DATABASE_SSL
          -e APP_KEYS -e API_TOKEN_SALT -e ADMIN_JWT_SECRET
          -e TRANSFER_TOKEN_SALT -e ENCRYPTION_KEY -e STRAPI_CRON_ENABLED
          -v "$PWD:/workspace" -w /workspace node:22-bookworm-slim
          sh -c "npm ci && npm run test:security && npm run build"

  dependency-scan:
    name: Security / Dependency SCA
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Resolve Maven dependency graph into CycloneDX
        working-directory: Backend/java-app1/demo
        run: |
          mkdir -p sca-output
          chmod -R a+rwx sca-output
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD:/workspace" -w /workspace maven:3.9-eclipse-temurin-25 \
            sh -c 'mvn -B --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DincludeTestScope=true -DoutputDirectory=/tmp/sca-output && cp /tmp/sca-output/bom.json /workspace/sca-output/bom.json'

      - name: Block High and Critical vulnerabilities in Maven, npm and pnpm
        run: |
          set -euo pipefail
          image=aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          # No default ignore list. Exceptions require formal, reviewed risk acceptance.
          docker run --rm -v "$PWD:/repo:ro" "$image" sbom \
            --severity HIGH,CRITICAL --exit-code 1 --ignorefile /dev/null \
            /repo/Backend/java-app1/demo/sca-output/bom.json
          docker run --rm -v "$PWD:/repo:ro" "$image" fs \
            --scanners vuln --offline-scan --severity HIGH,CRITICAL --exit-code 1 --ignorefile /dev/null \
            --include-dev-deps --skip-dirs '**/node_modules' --skip-dirs '**/target' /repo

  frontend-security-e2e:
    name: Frontend / Security E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Require Docker
        run: docker info

      - name: Run Auth/BFF/Tenant security suite
        working-directory: Frontend/web-app3/escala
        run: >-
          docker run --rm
          -e CI=true
          -v "$PWD:/workspace" -w /workspace
          mcr.microsoft.com/playwright:v1.55.0-noble
          bash -lc "corepack enable && corepack prepare pnpm@10.33.3 --activate &&
          pnpm install --frozen-lockfile && pnpm run test:e2e:ci"

  required-gate:
    name: CI / Required Gate
    if: always()
    needs:
      - versioned-secret-scan
      - backend-unit
      - backend-integration
      - frontend
      - cms
      - frontend-security-e2e
      - dependency-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        shell: bash
        run: |
          results=(
            "${{ needs.versioned-secret-scan.result }}"
            "${{ needs.backend-unit.result }}"
            "${{ needs.backend-integration.result }}"
            "${{ needs.frontend.result }}"
            "${{ needs.cms.result }}"
            "${{ needs.frontend-security-e2e.result }}"
            "${{ needs.dependency-scan.result }}"
          )
          printf 'Required job result: %s\n' "${results[@]}"
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
